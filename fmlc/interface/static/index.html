<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMLC Web Interface</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; background: #f4f4f4; color: #222; }

    /* ---- Navigation / tab bar ---- */
    /* Future tabs: add <li> here + matching page <div> below + case in showPage(). */
    nav { background: #2c3e50; padding: 0 16px; display: flex; align-items: stretch; }
    nav h1 { color: #ecf0f1; font-size: 16px; font-weight: bold; padding: 10px 16px 10px 0; margin-right: 8px; border-right: 1px solid #4a6278; white-space: nowrap; }
    nav ul { list-style: none; display: flex; align-items: stretch; }
    nav ul li a { display: block; padding: 12px 16px; color: #bdc3c7; text-decoration: none; font-size: 13px; }
    nav ul li a:hover, nav ul li a.active { color: #fff; background: #34495e; }

    /* ---- Page container ---- */
    .page { display: none; padding: 20px; flex-direction: column; align-items: center; }
    .page.active { display: flex; }

    /* ---- Panel ---- */
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 16px 20px; margin-bottom: 16px; width: 100%; max-width: 900px; }
    .panel h2 { font-size: 14px; font-weight: bold; margin-bottom: 12px; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 6px; }

    /* ---- Row layout ---- */
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .row:last-child { margin-bottom: 0; }
    label { font-weight: normal; white-space: nowrap; }

    /* ---- Buttons ---- */
    button { padding: 6px 14px; border: 1px solid #aaa; border-radius: 3px; background: #e8e8e8; cursor: pointer; font-size: 13px; white-space: nowrap; }
    button:hover { background: #d4d4d4; }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { background: #2980b9; color: #fff; border-color: #2471a3; }
    button.primary:hover { background: #2471a3; }
    button.success { background: #27ae60; color: #fff; border-color: #1e8449; }
    button.success:hover { background: #1e8449; }
    button.danger { background: #c0392b; color: #fff; border-color: #a93226; }
    button.danger:hover { background: #a93226; }

    /* ---- Status badge ---- */
    #status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; background: #95a5a6; color: #fff; min-width: 80px; text-align: center; }
    #status-badge.idle { background: #95a5a6; }
    #status-badge.loaded { background: #2980b9; }
    #status-badge.running { background: #27ae60; }
    #status-badge.stopped { background: #e67e22; }
    #status-badge.error { background: #c0392b; }

    /* ---- Stack config inputs ---- */
    .cfg-input { padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; }
    .cfg-input:disabled { background: #f0f0f0; color: #aaa; }
    .cfg-input-sm { width: 52px; }
    .cfg-input-md { width: 120px; }

    /* ---- Misc ---- */
    #msg-line { font-size: 12px; color: #c0392b; min-height: 16px; margin-top: 4px; }
    #msg-line.ok { color: #27ae60; }

    /* ---- Loop tables ---- */
    #loop-tables { width: 100%; max-width: 900px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 10px; border: 1px solid #ddd; }
    th { background: #ecf0f1; font-weight: bold; color: #34495e; }
    tr:nth-child(even) td { background: #fafafa; }
    .cell-log { word-break: break-word; max-width: 400px; }
    .cell-exec { white-space: nowrap; min-width: 140px; }

    /* ---- Last log line (main page) ---- */
    #last-log { font-size: 12px; font-family: monospace; color: #555; min-height: 16px; word-break: break-all; }

    /* ---- Log output (log tab) ---- */
    #log-output { width: 100%; font-family: monospace; font-size: 13px; white-space: pre-wrap; overflow-y: auto; height: calc(100vh - 120px); padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 4px; }
  </style>
</head>
<body>

<nav>
  <h1>FMLC Web Interface</h1>
  <ul>
    <li><a href="#" class="active" onclick="showPage('main', this); return false;">Control Stack</a></li>
    <li><a href="#" onclick="showPage('logs', this); return false;">Log FMLC</a></li>
  </ul>
</nav>

<!-- Page: Control Stack -->
<div class="page active" id="page-main">

  <div class="panel">
    <h2>Controller Configuration</h2>

    <div class="row">
      <label for="config-file">Select FMLC config:</label>
      <input type="file" id="config-file" accept=".json" onchange="onFileSelected(this)">
    </div>

    <div class="row">
      <label for="cfg-tz">Time Zone:</label>
      <input type="number" id="cfg-tz" class="cfg-input cfg-input-sm" value="-8" min="-12" max="14" disabled>
      <label for="cfg-name">Zone Name:</label>
      <input type="text" id="cfg-name" class="cfg-input cfg-input-md" value="FMLCWebUI" disabled>
      <label for="cfg-loglevel">Log Level:</label>
      <input type="number" id="cfg-loglevel" class="cfg-input cfg-input-sm" value="3" min="1" max="5" disabled>
    </div>

    <div class="row">
      <button class="primary" id="btn-load" onclick="loadConfig()" disabled>Load Config</button>
      <button class="success" id="btn-start" onclick="startFmlc()" disabled>Start FMLC</button>
      <button class="danger" id="btn-stop" onclick="stopFmlc()" disabled>Stop FMLC</button>
      <button id="btn-unload" onclick="unloadFmlc()" disabled>Unload FMLC</button>
      <span id="status-badge" class="idle">Idle</span>
    </div>

    <div id="msg-line"></div>
  </div>

  <!-- Latest log line -->
  <div class="panel">
    <h2>Last FMLC Log</h2>
    <div id="last-log">Last FMLC log message will appear here. Set the log level higher to reduce verbosity.</div>
  </div>

  <!-- Loop tables populated dynamically by buildTables() in app.js -->
  <div id="loop-tables">
    <p style="color:#888; font-size:13px;">Load a config file to display the control loop tables.</p>
  </div>

</div><!-- end page-main -->

<!-- Page: Log FMLC -->
<div class="page" id="page-logs">
  <div style="width:100%; max-width:900px; display:flex; flex-direction:column; flex:1;">
    <div style="margin-bottom:8px;">
      <button onclick="clearLogs()" style="font-size:12px; padding:4px 10px;">Clear</button>
    </div>
    <div id="log-output"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
